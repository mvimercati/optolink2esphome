# Viessmann Vitodens 242-F in Home Assistant: the ESP32-S3 talks P300 to the boiler itself.
#
# Home Assistant ──API── ESP32-S3 (USB host) ──USB── Optolink adapter (FTDI, 4800 8E2) ──IR── boiler
#
# The local component "optolink" polls the datapoints of viessmann.yaml (register table and entities)
# and writes the settings changed from Home Assistant. Build, flash: README.md. ESPHome >= 2026.10.

substitutions:
  name: optolink-bridge  # same node as the plain bridge firmware: Home Assistant keeps the device
  friendly_name: Vitodens 242-F  # HA device name; the ESPHome entry is titled "Caldaia" in HA

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - <esp_pm.h>

packages:
  viessmann: !include viessmann.yaml

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-s3-devkitc-1  # ESP32-S3 N16R8 devkit: 16 MB flash, 8 MB octal PSRAM
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: y  # esp_pm_configure(): the CPU clock can change at runtime
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y  # idle time per core: the CPU load sensors

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0  # the CH340 port; the native USB port (GPIO19/20) is the USB host
  logs:
    light: INFO  # the status LED changes every 500 ms while blinking

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}  # same key as the api

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # no modem sleep: lower latency, fewer lost packets on weak WiFi
  on_disconnect:
    - lambda: id(wifi_disconnects) += 1;

globals:
  - id: wifi_disconnects  # since boot; published once the WiFi is back
    type: uint32_t
    initial_value: "0"

usb_host:

usb_uart:
  - type: ft232  # FTDI 0403:6001; check the real VID:PID in the logs
    channels:
      - id: optolink_uart
        baud_rate: 4800
        data_bits: 8
        parity: EVEN
        stop_bits: 2

optolink:
  uart_id: optolink_uart
  connected:
    id: boiler_link
    name: Comunicazione caldaia
  errors:
    name: Errori Optolink

# Status LED, faults first: blinking red = no boiler, blinking purple = no Home Assistant. Then
# burner on: blue loading hot water, orange heating, brighter with more power. Dim green = idle.
light:
  - platform: esp32_rmt_led_strip  # the onboard WS2812: GPIO48 (GPIO38 on DevKitC-1 v1.1)
    id: status_led
    name: LED stato
    internal: true
    pin: GPIO38
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    rmt_symbols: 96
  - platform: esp32_rmt_led_strip  # LED TEST
    id: test_led48
    name: LED test 48
    internal: true
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    rmt_symbols: 96

interval:
  - interval: 500ms
    then:
      - lambda: |-  # LED TEST: GPIO38 full red, GPIO48 full blue
          id(status_led).turn_on().set_rgb(1, 0, 0).set_brightness(1).perform();
          id(test_led48).turn_on().set_rgb(0, 0, 1).set_brightness(1).perform();

# Diagnostics
debug:
  update_interval: 30s

sensor:
  - platform: uptime
    name: Uptime
  - platform: internal_temperature
    name: Temperatura ESP
    update_interval: 60s
  - platform: wifi_signal
    name: Segnale WiFi
    update_interval: 60s
  - platform: debug
    free:
      name: Heap libero
    block:
      name: Heap blocco max
    loop_time:
      name: Tempo loop max
  - platform: template  # 100 % - idle task share since the last update (run time stats: esp_timer, µs)
    id: cpu_load0
    name: Carico CPU core 0
    update_interval: 10s
    lambda: |-
      static uint32_t idle, last;
      uint32_t now = esp_timer_get_time(), t = ulTaskGetIdleRunTimeCounterForCore(0);
      float load = last ? 100 * (1 - float(t - idle) / float(now - last)) : NAN;
      idle = t;
      last = now;
      return load;
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    entity_category: diagnostic
    icon: mdi:cpu-64-bit
  - platform: template
    id: cpu_load1
    name: Carico CPU core 1
    update_interval: 10s
    lambda: |-
      static uint32_t idle, last;
      uint32_t now = esp_timer_get_time(), t = ulTaskGetIdleRunTimeCounterForCore(1);
      float load = last ? 100 * (1 - float(t - idle) / float(now - last)) : NAN;
      idle = t;
      last = now;
      return load;
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    entity_category: diagnostic
    icon: mdi:cpu-64-bit
  - platform: template
    name: Disconnessioni WiFi
    lambda: return id(wifi_disconnects);
    update_interval: 60s
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: Motivo reset
  - platform: wifi_info
    ip_address:
      name: Indirizzo IP

button:
  - platform: restart
    name: Riavvia

# CPU clock, kept across reboots: a cooler chip at 80/160 MHz (WiFi and USB host still run).
# Fixed, no frequency scaling: min = max, no light sleep.
select:
  - platform: template
    id: cpu_clock
    name: Frequenza CPU
    icon: mdi:speedometer
    entity_category: config
    options: ["240 MHz", "160 MHz", "80 MHz"]
    initial_option: "240 MHz"
    optimistic: true
    restore_value: true
    on_value:  # also at boot, with the restored option
      - lambda: |-
          static const int mhz[] = {240, 160, 80};
          esp_pm_config_t pm = {.max_freq_mhz = mhz[i], .min_freq_mhz = mhz[i], .light_sleep_enable = false};
          esp_err_t err = esp_pm_configure(&pm);
          ESP_LOGI("cpu", "Clock %d MHz: %s", mhz[i], esp_err_to_name(err));
